name: Sync upstream

on:
  schedule:
    # Mondays at 9:17 AM New York time; GitHub adjusts for daylight saving.
    # Off the top of the hour: GitHub delays :00 schedules when the queue is busy.
    - cron: "17 9 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:

# The job's GITHUB_TOKEN only needs to push the sync merge commit to main.
permissions:
  contents: write

# Never let two syncs run at once (a manual run during the scheduled one would
# race to push to main); queue the second instead of cancelling it.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new upstream commits
        id: upstream
        run: |
          git remote add upstream https://github.com/cursor/plugins.git
          git fetch upstream main
          # If main already contains upstream's latest commit, there is nothing
          # to merge, so every later step is skipped.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already has every upstream commit; nothing to sync"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.upstream.outputs.has_changes == 'true'
        with:
          node-version: lts/*

      - name: Merge cursor/plugins, regenerate manifests, and push to main
        if: steps.upstream.outputs.has_changes == 'true'
        run: |
          # The runner has no git identity; this is the standard bot author.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitattributes marks files where our copy always wins the merge.
          git config merge.ours.driver true

          # Merge without committing so the regenerated manifests go into the
          # same merge commit: each sync adds exactly one commit to main. A
          # merge commit (never a squash) keeps upstream's history on main, so
          # the next sync only brings in new upstream commits.
          git merge --no-commit --no-ff upstream/main
          node scripts/sync-devin-manifests.mjs
          npm install --no-save --package-lock=false ajv ajv-formats
          node scripts/validate-plugins.mjs
          git add -A
          git commit -m "chore: sync with upstream cursor/plugins"
          git push origin HEAD:main
